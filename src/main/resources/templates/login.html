<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #000000; /* Svart bakgrunn */
            color: #00FF00; /* Matrix-grønn tekst */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
        }
        .login-container {
            background-color: rgba(0, 0, 0, 0.8); /* Semi-transparent sort boks */
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #00FF00;
            box-shadow: 0 0 20px #00FF00;
        }
        input {
            background-color: #000;
            border: 1px solid #00FF00;
            color: #00FF00;
        }
        input::placeholder {
            color: #00FF00;
        }
        button {
            background-color: #00FF00;
            color: #000;
            border: none;
        }
        button:hover {
            background-color: #00cc00;
            color: #000;
        }
    </style>
</head>
<body>

<div class="login-container text-center">
    <h2 class="mb-4">Welcome to the Matrix</h2>

    <!-- Login form -->
    <form action="/login" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">Username:</label>
            <input type="text" id="username" name="username" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password:</label>
            <input type="password" id="password" name="password" class="form-control" required/>
        </div>
        <button type="submit" class="btn btn-success w-100">Login</button>
    </form>

    <!-- Display login error message if authentication fails -->
    <div class="mt-3">
        <span th:if="${param.error}" style="color:red;">Invalid username or password.</span>
    </div>
</div>

</body>
</html>
